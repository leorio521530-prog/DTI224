<!DOCTYPE html>
<html>
    <head>
        <title>Grade Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Calculate Grade</h1>

    <div class="input-group">
        <label for="score">Enter Amount:</label>
        <input type="number" id="scoreInput" placeholder="Enter your Score">
        <button onclick="calculate_grade()">Submit</button>
    </div>
    <h3 id="result"></h3>

    <script>
        function calculate_grade() {

            let score = document.getElementById("scoreInput").value;

            let resultDisplay = document.getElementById("result");


            if (score > 100 || score < 0) {
                resultDisplay.innerHTML = "Please enter the score between 0 and 100!";

            }
            else if (score >= 80) {
                resultDisplay.innerHTML = "You got an A";
            }
            else if (score >= 70) {
                resultDisplay.innerHTML = "You got a B";
            }
            else if (score >= 60) {
                resultDisplay.innerHTML = "You got a C";
            }
            else if (score >= 50) {
                resultDisplay.innerHTML = "You got a D";
            }
            else {
                resultDisplay.innerHTML = "You fail!";
            }

        }   
    </script>
</body>

</html>
